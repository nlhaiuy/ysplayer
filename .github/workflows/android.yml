name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 仓库里没有 gradlew，这里直接安装与 wrapper 配置一致的 Gradle 8.9
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      # 失败时把关键错误行提取成注释，方便在 Checks 页面直接看到
      - name: Summarize errors
        if: failure()
        run: |
          grep -E "^e: |issues were found|Unresolved|error:" -A45 build.log \
            | grep -E "^e: |issues were found|Dependency|requires|minCompileSdk|compileSdk|Android Gradle plugin|AGP|Unresolved|error:" \
            | cut -c1-300 | head -n 60 > errors.txt || true
          split -l 6 -d errors.txt chunk_
          for f in chunk_*; do
            msg=$(awk '{printf "%s%%0A", $0}' "$f")
            echo "::error title=build error::${msg}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: GlassPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
